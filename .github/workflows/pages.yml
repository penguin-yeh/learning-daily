name: Sync and deploy Pages

# 每日排程把成果推到 claude/* 分支。這個 workflow 把「最新一天」同步進 main，
# 然後把 main 部署到 GitHub Pages（Settings → Pages → Source 必須選「GitHub Actions」）。
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch source branch
        run: git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
      - name: Sync latest day into main
        run: scripts/sync_latest.sh "${GITHUB_REF_NAME}"
      - name: Push main
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi

  nav:
    needs: sync
    if: ${{ always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh date navigation
        run: |
          python3 scripts/add_nav.py
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Refresh date navigation"
            git push origin HEAD:main
          fi

  deploy:
    needs: nav
    if: ${{ always() && needs.nav.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
